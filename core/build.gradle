plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'vibe.liteming'
// llm-core ships as its own artifact (and Forge mod jar via the llmcore-mod
// sibling project); its version is independent of the llmjs mod version.
version = rootProject.hasProperty('llmcore_version') ? rootProject.llmcore_version : '1.0.0'

base {
    archivesName = 'llm-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'llm-core'
        }
    }
}
