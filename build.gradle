buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.+'
    id 'net.darkhax.curseforgegradle' version '1.1.24'
}

version = "${mod_version}"
group = 'vibe.liteming.llmjs'
archivesBaseName = 'llmjs'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                llmjs {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                llmjs {
                    source sourceSets.main
                }
            }
        }
    }
}
repositories {
    maven { url = 'https://maven.latvian.dev/' }
    maven {
        url "https://cursemaven.com"
    }

}

dependencies {
    implementation project(path: ':llmcore-mod', configuration: 'developmentRuntime')
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf("curse.maven:kubejs-238086:5853326")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")
    implementation fg.deobf("curse.maven:configured-457570:5180900")
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

evaluationDependsOn(':core')
evaluationDependsOn(':llmcore-mod')

// Production jars must be reobfuscated for Forge runtime (SRG names).
// Without reobfJar, Commands.literal/etc resolve as NoSuchMethodError in packs.
//
// llmjs is now the KubeJS adapter. Runtime services and the Console ship from
// :llmcore-mod; project dependencies provide compile-time visibility only and
// are not embedded in the llmjs production jar.
jar {
    finalizedBy 'reobfJar'
}

tasks.named('build').configure {
    dependsOn 'reobfJar'
}

def runtimeOwnedPrefixes = [
        'vibe/liteming/llmjs/api/',
        'vibe/liteming/llmjs/client/',
        'vibe/liteming/llmjs/command/',
        'vibe/liteming/llmjs/compat/',
        'vibe/liteming/llmjs/config/',
        'vibe/liteming/llmjs/format/',
        'vibe/liteming/llmjs/http/',
        'vibe/liteming/llmjs/log/',
        'vibe/liteming/llmjs/network/',
        'vibe/liteming/llmjs/provider/',
        'vibe/liteming/llmjs/test/',
        'vibe/liteming/llmjs/vision/'
]

tasks.register('verifyAdapterJarBoundary') {
    group = 'verification'
    description = 'Ensures llmjs only ships its KubeJS-facing adapter classes.'
    dependsOn 'reobfJar'

    doLast {
        File artifact = tasks.named('jar').get().archiveFile.get().asFile
        List<String> entries = []
        zipTree(artifact).visit { details ->
            if (!details.directory) entries.add(details.path)
        }

        List<String> violations = entries.findAll { path ->
            runtimeOwnedPrefixes.any { path.startsWith(it) }
                    || path.startsWith('vibe/liteming/llmjs/pipeline/')
        }
        if (!violations.isEmpty()) {
            throw new GradleException("llmjs jar contains llmcore-owned runtime classes:\n"
                    + violations.sort().join('\n'))
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyAdapterJarBoundary'
}
