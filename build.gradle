buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.+'
    id 'net.darkhax.curseforgegradle' version '1.1.24'
}

version = "${mod_version}"
group = 'vibe.liteming.llmjs'
archivesBaseName = 'llmjs'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                llmjs {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                llmjs {
                    source sourceSets.main
                }
            }
        }
    }
}
repositories {
    maven { url = 'https://maven.latvian.dev/' }
    maven {
        url "https://cursemaven.com"
    }

}

dependencies {
    implementation project(':core')
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf("curse.maven:kubejs-238086:5853326")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")
    implementation fg.deobf("curse.maven:configured-457570:5180900")
    implementation 'com.google.code.gson:gson:2.10.1'
}

evaluationDependsOn(':core')

// Production jars must be reobfuscated for Forge runtime (SRG names).
// Without reobfJar, Commands.literal/etc resolve as NoSuchMethodError in packs.
//
// llm-core is NO LONGER embedded into the llmjs jar: it ships as its own Forge
// mod (the :llmcore-mod sibling project -> llmcore-x.y.z.jar) that llmjs
// declares as an optional dependency. This keeps exactly one copy of
// vibe.liteming.llmcore.* on the runtime classpath when llmjs and CreatureChat
// are both installed, eliminating the split-package collisions that previously
// forced CreatureChat to shadow-relocate. Compile-time visibility of the core
// API is still provided by `implementation project(':core')` above.
jar {
    finalizedBy 'reobfJar'
}

tasks.named('build').configure {
    dependsOn 'reobfJar'
}
